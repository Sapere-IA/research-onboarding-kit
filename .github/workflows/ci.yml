name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Shellcheck hook and kit scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # .template scripts contain {{PLACEHOLDER}} tokens and are not valid shell yet.
          files=$(find hooks scripts -name '*.sh' -not -name '*.template')
          echo "Checking:"; echo "$files"
          shellcheck $files

  pycompile:
    name: Byte-compile Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile
        run: python -m py_compile scripts/*.py

  consistency:
    name: Reference, rendering and placeholder consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Placeholder tokens only where expected
        run: |
          # {{PLACEHOLDER}} tokens belong in templates/ and *.template files. A few docs
          # mention the convention itself; render.sh/.ps1 fill the shell template's tokens.
          allowlist='^(\./)?(templates/|scripts/[^/]+\.template$|scripts/render\.(sh|ps1)$|scripts/validate_structure\.py$|README\.md$|README\.html$|DOCUMENTATION\.html$|instructions\.md$|CHANGELOG\.md$|skills/research-workflow/doc-format\.md$|skills/rdd-update/SKILL\.md$|skills/optional/|\.github/)'
          offenders=$(grep -rl "{{[A-Z0-9_][A-Z0-9_]*}}" . --include='*.md' --include='*.sh' --include='*.ps1' --include='*.py' --include='*.html' --include='*.json' --include='*.template' --include='*.css' --include='*.js' | grep -Ev "$allowlist" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Unexpected {{PLACEHOLDER}} tokens in:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: placeholder tokens only in expected locations."

      - name: No stale v1 (HTML-template) references
        run: |
          # Since 2.0.0 every human-facing doc is markdown rendered by scripts/render.sh.
          # The v1 HTML templates and the copied design-system assets must not come back.
          # Allowed: the changelog, the update skill's migration notes, the generated manifest, this workflow.
          pattern='experiment-card\.html|analysis-report\.html|infra-spec\.html|PLAN\.html\.template|experiment-card-format|NOTEBOOK\.html\.template|templates/assets/'
          offenders=$(grep -rnE "$pattern" . --include='*.md' --include='*.sh' --include='*.ps1' --include='*.py' --include='*.template' --include='*.html' --include='*.json' --include='*.yml' \
            | grep -vE '^(\./)?(CHANGELOG\.md|skills/rdd-update/|manifest\.md|\.github/)' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Stale v1 reference found (docs are markdown now; HTML is rendered):"
            echo "$offenders"
            exit 1
          fi
          echo "OK: no stale v1 references."

      - name: Installable content stays harness-neutral
        run: |
          # Agents, skills and templates are installed into any harness (Claude Code, Codex,
          # Cursor, OpenCode, Antigravity). They must not hard-code one harness: no
          # "Claude must/should/…" phrasing, no `.claude/` paths, no `CLAUDE.md` as the
          # project instruction file. Per-harness lines (naming another harness) are allowed.
          offenders=$(grep -rn -E 'Claude (Code )?(must|may|should|can|cannot|never|asks|drafts|proposes)|\.claude/|CLAUDE\.md' \
              agents skills/research-workflow skills/optional skills/bro skills/closing templates/docs \
              templates/AGENTS.md.template templates/project-map.md.template \
            | grep -v -E 'Codex|Cursor|OpenCode|Antigravity|harness-primitives' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Harness-specific wording in installable content:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: installable content is harness-neutral."

      - name: Hook adapter block is identical in every hook
        run: |
          # The RDD hook adapter (hooks/hooks-policy.md, "Hook contract") must be
          # byte-identical across the example hooks apart from the default event name.
          extract() { sed -n '/^# ---- RDD hook adapter/,/^# ---- end RDD hook adapter ----/p' "$1" | sed -E 's/rdd_event:-[A-Za-z]+/rdd_event:-EVENT/'; }
          ref=$(extract hooks/examples/block-unapproved-launch.sh)
          [ -n "$ref" ] || { echo "::error::adapter block not found in the reference hook"; exit 1; }
          for f in $(find hooks/examples -name '*.sh'); do
            if [ "$(extract "$f")" != "$ref" ]; then
              echo "::error::adapter block in $f differs from block-unapproved-launch.sh"
              diff <(echo "$ref") <(extract "$f") || true
              exit 1
            fi
          done
          echo "OK: adapter block identical in $(find hooks/examples -name '*.sh' | wc -l | tr -d ' ') hooks."

      - name: Rendered examples are up to date
        run: |
          # The kit commits its rendered reference examples; re-render and compare.
          sh scripts/render.sh experiments notebook experiments/*/
          if ! git diff --exit-code -- '*.html'; then
            echo "::error::Rendered examples are stale. Run: sh scripts/render.sh experiments notebook experiments/*/"
            exit 1
          fi
          echo "OK: rendered examples match their sources."

      - name: Example registry is consistent
        run: python scripts/validate_registry.py

      - name: manifest.md is up to date
        run: |
          bash scripts/update-manifest.sh
          if ! git diff --exit-code manifest.md; then
            echo "::error::manifest.md is stale. Run scripts/update-manifest.sh and commit the result."
            exit 1
          fi
          echo "OK: manifest.md matches git ls-files."
